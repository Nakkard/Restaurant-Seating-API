name: restaurant-seating

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:?Set SQL_SERVER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQL_SERVER_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
            SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null;
          else
            SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null;
          fi
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      target: final
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Restaurant: "Server=db;Database=RestaurantSeating;User Id=sa;Password=${SQL_SERVER_PASSWORD};Encrypt=true;TrustServerCertificate=true"
    depends_on:
      db:
        condition: service_healthy

  tests:
    profiles: [tests]
    build:
      context: .
      target: tests
    environment:
      RESTAURANT_TEST_CONNECTION_STRING: "Server=db;Database=master;User Id=sa;Password=${SQL_SERVER_PASSWORD};Encrypt=true;TrustServerCertificate=true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sql-data:
